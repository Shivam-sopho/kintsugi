<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2B4A"/>
      <stop offset="100%" stop-color="#121B30"/>
    </linearGradient>
    <linearGradient id="porcelain" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F2EE"/>
      <stop offset="100%" stop-color="#D7DDD6"/>
    </linearGradient>
    <linearGradient id="indigo-glaze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D4674"/>
      <stop offset="60%" stop-color="#1D2E50"/>
      <stop offset="100%" stop-color="#141E33"/>
    </linearGradient>
    <linearGradient id="gold-seam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9C721D"/>
      <stop offset="35%" stop-color="#E5B842"/>
      <stop offset="70%" stop-color="#FFF2A3"/>
      <stop offset="100%" stop-color="#D69B26"/>
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- Ceramic Ring Shadow -->
  <circle cx="32" cy="33.5" r="19" fill="none" stroke="#0B101E" stroke-width="8.5" opacity="0.45"/>

  <!-- Ceramic Torus - Porcelain Section -->
  <path d="M 32 13 A 19 19 0 0 1 51 32 A 19 19 0 0 1 32 51" 
        fill="none" stroke="url(#porcelain)" stroke-width="7.5" stroke-linecap="round"/>

  <!-- Ceramic Torus - Indigo/Celadon Glaze Section -->
  <path d="M 32 51 A 19 19 0 0 1 13 32 A 19 19 0 0 1 32 13" 
        fill="none" stroke="url(#indigo-glaze)" stroke-width="7.5" stroke-linecap="round"/>

  <!-- Kintsugi Fractures & Gold Repair Seams -->
  <!-- Top Joint Fracture -->
  <path d="M 32 8.5 Q 31 11.5 33.5 13.5 T 31 17.5" 
        fill="none" stroke="url(#gold-seam)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#gold-glow)"/>
  
  <!-- Diagonal Crack Branch -->
  <path d="M 32.5 12.8 Q 36 14 38 15" 
        fill="none" stroke="url(#gold-seam)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Bottom Joint Fracture -->
  <path d="M 32 46.5 Q 33.5 49 30.5 51.5 T 32.5 55.5" 
        fill="none" stroke="url(#gold-seam)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#gold-glow)"/>

  <!-- Flowing Gold Vein along Ring -->
  <path d="M 43 20 Q 47 26 44 32" 
        fill="none" stroke="url(#gold-seam)" stroke-width="1.6" stroke-linecap="round" opacity="0.95"/>

  <!-- Radiant Gold Center Sparkle / AI Star -->
  <g transform="translate(32, 13) scale(0.65)" filter="url(#gold-glow)">
    <path d="M 0 -7 Q 0 0 7 0 Q 0 0 0 7 Q 0 0 -7 0 Q 0 0 0 -7 Z" fill="#FFF6BD"/>
  </g>
</svg>
